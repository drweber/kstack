id: audit-network-mtls-permissive
skill: audit-network
description: >
  Verifies that /audit-network flags an Istio PeerAuthentication in
  PERMISSIVE mode (plaintext-allowed) — Workflow 5. wait.sh installs a
  minimal PeerAuthentication CRD inline so the audit-network mesh-CRD
  probe detects "Istio is present"; fixture plants the permissive
  policy in the eval namespace.
namespace: eval-audit-network-mtls-permissive
runs: 3
pass_threshold: 2
wait_seconds: 60
claude_flags:
  model: ""
  allowed_tools: "Bash"
