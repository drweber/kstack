id: audit-network-dns-broken-forwarder
skill: audit-network
description: >
  Verifies that /audit-network flags a stub-domain forwarder in the
  CoreDNS Corefile that points at an unreachable upstream — Workflow 4.
  wait.sh patches the kube-system coredns ConfigMap (after backing up
  the original Corefile to an annotation); teardown.sh restores it.
namespace: eval-audit-network-dns-broken-forwarder
runs: 3
pass_threshold: 2
wait_seconds: 120
claude_flags:
  model: ""
  allowed_tools: "Bash"
