id: audit-security-pod-privileged
skill: audit-security
description: >
  Verifies that /audit-security flags a pod with host-level escapes:
  privileged container with hostNetwork enabled.
namespace: eval-audit-security-pod-privileged
runs: 3
pass_threshold: 2
wait_seconds: 60
claude_flags:
  model: ""
  allowed_tools: "Bash"
