apiVersion: v1
kind: Pod
metadata:
  name: checkout-api
  labels:
    app: checkout-api
spec:
  containers:
    - name: server
      image: busybox:latest
      command:
        - sh
        - -c
        - 'echo "FATAL: DATABASE_URL not set, refusing to start" >&2; exit 1'
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
  restartPolicy: Always
