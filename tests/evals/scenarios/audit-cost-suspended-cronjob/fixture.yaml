apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgotten-cron
spec:
  schedule: "*/5 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: noop
              image: busybox:latest
              command: ["true"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
