# Minimal deployment so target resolution (step 2) finds a real workload.
# Intentionally no Kubetail API pod — the scenario tests the missing-API
# error path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:latest
          command: ["sh", "-c", "while true; do echo 'api heartbeat'; sleep 60; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
