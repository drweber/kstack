apiVersion: v1
kind: Pod
metadata:
  name: privileged-pod
spec:
  hostNetwork: true
  containers:
    - name: shell
      image: busybox:latest
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
