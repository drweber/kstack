apiVersion: v1
kind: ServiceAccount
metadata:
  name: too-powerful-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wildcard-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: too-powerful-binding
subjects:
  - kind: ServiceAccount
    name: too-powerful-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wildcard-role
